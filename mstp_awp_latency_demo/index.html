<!DOCTYPE html>
<html>
<head>
    <title>AudioWorklet Latency Demo</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; }
        #latencyGraph { border: 1px solid #ccc; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>AudioWorklet Latency Demo</h1>
    <button id="startButton">Start Demo</button>
    <div id="glitchCount">Glitches: 0</div>
    <div>
        <input type="checkbox" id="useAW" name="useAW" checked>
        <label for="useAW">AudioWorklet</label>
        <input type="checkbox" id="useMSTP" name="useMSTP">
        <label for="useMSTP">MediaStreamTrackProcessor</label>

    </div>
    <div id="graphsContainer" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px;">
        <div id="awGraphContainer" style="display: none;">
            <h3>AudioWorklet</h3>
            <canvas id="awGraph" width="600" height="300" style="border: 1px solid #ccc;"></canvas>
        </div>
        <div id="mstpGraphContainer" style="display: none;">
            <h3>MediaStreamTrackProcessor</h3>
            <canvas id="mstpGraph" width="600" height="300" style="border: 1px solid #ccc;"></canvas>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
